services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: treebar
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - dbdata:/var/lib/mysql
      - ./treebar-back/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./treebar-back/init.sql:/docker-entrypoint-initdb.d/02-init.sql:ro
      - ./treebar-back/users.sh:/docker-entrypoint-initdb.d/03-users.sh:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7
    command: redis-server --requirepass ${REDIS_PASSWORD}
    restart: unless-stopped

  api:
    build:
      context: ./treebar-back
      dockerfile: dockerfile
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: treebar
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DATABASE_URL: mysql://${DB_USER}:${DB_PASSWORD}@db:3306/treebar
      REDIS: redis://:${REDIS_PASSWORD}@redis:6379
      UPC_API_KEY: ${UPC_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stoped

  expo:
    build:
      context: ./treebar-front
    environment:
      EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL}
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      - APP_DOMAIN=${APP_DOMAIN}
      - ACME_EMAIL=${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - expo
    restart: unless-stopped

volumes:
  dbdata:
  caddy_data:
  caddy_config: